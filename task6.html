<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
body{
    height: auto;
    width: auto;
    text-align: center;
}
.main{
    display: flex;
    align-items: flex-start;
    gap: 50px;
    margin-left: 50px;
}
.container1{
    background-color: aliceblue;
    outline-style:solid;
    outline-color: rgb(41, 126, 126);
    display: flex;
    margin: 10px;
    padding: 10px;
    width: 120px;
    border-radius: 10px;
    flex-direction: column;
    justify-content:center;
    align-items: center;
}
.container2{
    background-color: aliceblue;
    display: flex;
    outline-style: solid;
    margin: 10px;
    padding: 10px;
    width: 500px;
    border-radius: 10px;
    flex-direction: row;
    justify-content:center;
    align-items: center;
}
.box1{
    width: 100px;
    height: 50px;
    margin: 10px;
     background-color: aqua ;
    border: solid;
    border-color: rgb(41, 126, 126);
    border-radius: 10px;
    }   
.box2{
    width: 100px;
    height: 50px;
    margin: 10px;
     background-color:burlywood;
    border: solid;
    border-color: rgb(129, 71, 29) ;
    border-radius: 10px;
}
</style>
</head>
<body >
    <h2>Major Versions of HTML</h2>
    <div class="main">
    <div class="container1">
    <div class="box1 a">Box 1</div>
    <div class="box1 b">Box 2</div>
    <div class="box1 c">Box 3</div>
    <div class="box1 d">Box 4</div>
    </div>

    <div class="container2">
    <div class="box2 a">Box 1</div>
    <div class="box2 b">Box 2</div>
    <div class="box2 c">Box 3</div>
    <div class="box2 d">Box 4</div>
    </div>
    </div>
</body>
</html>
