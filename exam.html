<!DOCTYPE html>
<html>
<head>
    <title>Hotel Booking Form</title>
</head>
<body>
<h2>Hotel Booking Form</h2>
<table border="1" align="center" cellpadding="8" cellspacing="2">
<form>
<tr><td>
<label for="fullname">full name:</label>
<input type="text" id="fullname" name="fullname" required><br><br>
</td></tr>

<tr><td>
<label for="email">email:</label>
<input type="email" id="email" name="email" required><br><br>
</td></tr>

<tr><td>
<label for="phone">phone number:</label>
<input type="tel" id="phone" name="phone" required><br><br>
</td></tr>

<tr><td>
<label for="checkin">check-in date:</label>
<input type="date" id="checkin" name="checkin" required><br><br>
</td></tr>

<tr><td>
<label for="checkout">check-out date:</label>
<input type="date" id="checkout" name="checkout" required><br><br>
</tr></td>

<tr><td>
<label for="roomtype">room type:</label>
<select id="roomtype" name="roomtype" required>
<option value="">--select room type--</option>
<option value="single">single room</option>
<option value="double">double Room</option>
<option value="triple">triple room</opttion>
</select><br><br>
</td></tr>

<tr><td>
<label for="requests">special requests:</label><br>
<textarea id="requests" name="requests" rows="4" cols="40" placeholder="Write request here..."></textarea><br><br>
</td></tr>

<tr><td>
<button type="submit">submit</button>
<button type="reset">reset</button>
</td></tr>

</form>
</table>

</body>
</html>
